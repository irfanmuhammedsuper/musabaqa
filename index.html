<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7b1fa2">
<title>MUSABAQA WINNERS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#7b1fa2;--s:#ff6f00;--a:#ffd54f;--bg:#f4f2f8;--card:#fff;--card2:#f8f6fc;--tx:#1b1726;--mu:#6d6880;--bd:#e8e4f0;--ok:#16a34a;--er:#dc2626;--r:20px;--sh:0 10px 40px -12px rgba(60,20,90,.18);--g:linear-gradient(135deg,var(--p),var(--s))}
@media(prefers-color-scheme:dark){:root:not([data-t=l]){--bg:#0f0c16;--card:#191424;--card2:#211b30;--tx:#f3eefb;--mu:#a49dba;--bd:#2c2540;--sh:0 10px 40px -12px #000}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}svg{flex:none}
:root{padding-top:env(safe-area-inset-top,0)}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:12px 20px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.3px}.brand img{height:56px;width:auto;max-width:150px;min-width:56px;object-fit:contain;border-radius:14px;background:#fff;padding:4px 6px;box-shadow:var(--sh)}.brand small{display:block;font-weight:600;font-size:11px;color:var(--mu)}
.sp{flex:1}.layout{display:flex}.side{width:230px;padding:18px 12px;position:sticky;top:86px;height:calc(100vh - 86px);flex:none}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin:3px 0;border-radius:14px;background:none;color:var(--mu);font-weight:700;transition:.2s}.nav:hover{background:var(--card)}.nav.on{background:var(--g);color:#fff;box-shadow:0 10px 24px -10px var(--p)}
.main{flex:1;min-width:0;padding:22px;padding-bottom:100px}.page{max-width:1280px;margin:auto;animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}.head h1{margin:0;font-size:28px;letter-spacing:-.5px}.head p{margin:4px 0 0;color:var(--mu)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:14px;font-weight:700;background:var(--card);border:1px solid var(--bd);transition:.15s}.btn:active{transform:scale(.97)}.btn:hover{border-color:var(--p)}
.btn.pri{background:var(--g);color:#fff;border:0;box-shadow:0 10px 24px -10px var(--p)}.btn.dan{color:var(--er)}.btn.ok{background:#16a34a;color:#fff;border:0}.btn.ic{width:44px;padding:0}.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.hero{background:var(--g);color:#fff;border-radius:28px;padding:28px;position:relative;overflow:hidden;margin-bottom:16px}.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:#ffffff1f}.hero h2{margin:0 0 6px;font-size:26px}.hero p{margin:0 0 18px;opacity:.85}.hero .btn{background:#fff;color:var(--p);border:0}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.stat{display:flex;gap:14px;align-items:center}.stat .ico{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:22px;background:var(--card2)}.stat b{font-size:28px;display:block;line-height:1}.stat span{font-size:12px;color:var(--mu);font-weight:700}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.in{width:100%;min-height:46px;border:1px solid var(--bd);background:var(--card);border-radius:14px;padding:0 14px;outline:none;transition:.15s}.in:focus{border-color:var(--p);box-shadow:0 0 0 4px color-mix(in srgb,var(--p) 18%,transparent)}textarea.in{padding:12px;min-height:120px}
.sw{position:relative;flex:2;min-width:220px}.sw svg{position:absolute;left:14px;top:14px;color:var(--mu)}.sw .in{padding-left:42px}.tools select.in{flex:1;min-width:140px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:color-mix(in srgb,var(--p) 12%,transparent);color:var(--p);font-size:11px;font-weight:800}.tag.done{background:#16a34a22;color:var(--ok)}
.item{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:14px 16px;border:1px solid var(--bd);border-radius:18px;background:var(--card);margin-bottom:10px;transition:.2s}.item:hover{transform:translateY(-2px);box-shadow:var(--sh)}.item h3{margin:6px 0 2px;font-size:16px}.mu{color:var(--mu);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.pod{display:flex;flex-direction:column;gap:8px;margin:12px 0}.row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:var(--card2)}.row.e{opacity:.5}
.av{width:46px;height:46px;border-radius:50%;object-fit:cover;display:grid;place-items:center;font-size:20px;background:var(--card);border:3px solid var(--bd)}.m1 .av{border-color:#f5b400}.m2 .av{border-color:#b0bec5}.m3 .av{border-color:#cd7f32}
.row b{display:block;font-size:14px}.row small{color:var(--mu)}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:6px;margin-bottom:10px}.chip{padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-weight:700;font-size:13px;white-space:nowrap}.chip.on{background:var(--g);color:#fff;border:0}
.fld{margin-bottom:12px}.fld label{display:block;font-size:11px;font-weight:800;color:var(--mu);margin-bottom:6px;letter-spacing:.5px}
.modal{position:fixed;inset:0;z-index:80;background:#0009;backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;animation:fd .2s}@keyframes fd{from{opacity:0}}
.box{background:var(--bg);width:min(860px,100%);max-height:92vh;overflow:auto;border-radius:26px;padding:22px;box-shadow:0 30px 80px #0006;animation:in .3s}.box.sm{width:min(460px,100%)}
.up{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.up .card{padding:14px;box-shadow:none}.pv{display:flex;gap:8px;align-items:center;margin-top:8px}.pv img{width:56px;height:67px;border-radius:14px;object-fit:cover}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}.meta div{background:var(--card2);padding:10px;border-radius:12px}.meta small{display:block;font-size:10px;color:var(--mu);font-weight:800}.meta b{font-size:13px}
.pick{padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);margin-top:6px;cursor:pointer}.pick:hover{border-color:var(--p)}
.cres{margin-top:6px;max-height:230px;overflow:auto}.cres .pick{margin-top:4px;padding:8px 10px}.cres .pick b{font-size:14px}.poster{width:100%;max-height:70vh;object-fit:contain;border-radius:18px;background:#000;display:block}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 15%,#ffd54f66,transparent 35%),radial-gradient(circle at 85% 90%,#ff6f0066,transparent 40%),linear-gradient(135deg,#3b0a5c,#7b1fa2 55%,#ff6f00)}
.lb{width:min(420px,100%);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(20px);border-radius:30px;padding:32px;box-shadow:0 40px 90px #0007}.lb img{display:block;height:120px;width:auto;max-width:82%;object-fit:contain;margin:0 auto 16px}.lb h2{text-align:center;margin:0}.lb p{text-align:center;color:var(--mu);margin:4px 0 20px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:120;padding:13px 20px;border-radius:14px;color:#fff;font-weight:700;background:#222;box-shadow:0 14px 34px #0005;animation:in .25s}.toast.ok{background:var(--ok)}.toast.err{background:var(--er)}
.sk{background:linear-gradient(90deg,var(--card2),var(--bd),var(--card2));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:16px;height:90px}@keyframes sh{to{background-position:-200% 0}}
.spin{width:18px;height:18px;border:3px solid #fff5;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:46px 10px;color:var(--mu)}
.mnav{display:none}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.brand img{height:48px;max-width:110px}.side{display:none}.main{padding:14px 14px 100px}.g4,.g2,.g3{grid-template-columns:1fr 1fr}.g2,.g3.w{grid-template-columns:1fr}.up{grid-template-columns:1fr}.head h1{font-size:23px}.modal{place-items:end center;padding:0}.box{border-radius:26px 26px 0 0;max-height:94vh;width:100%}
.mnav{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0));z-index:50;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:24px;padding:6px;box-shadow:var(--sh)}.mnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:18px;background:none;color:var(--mu);font-size:10px;font-weight:800}.mnav button.on{background:var(--g);color:#fff}.item{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<div id="loginView" class="login hidden"><div class="lb"><img id="loginLogo" alt=""><h2>MUSABAQA WINNERS</h2><p>Admin &amp; Poster Manager</p>

<div id="appView" class="hidden">

<div id="modal" class="modal hidden"><div id="box" class="box"></div></div><div id="toast" class="toast hidden"></div>

 const end=()=>{done=true;clearTimeout(tm);s.remove();delete window[cb]};const retry=()=>{end();n<3?setTimeout(go,900):rej(new Error("Cannot reach the server. Check the Web App URL / deployment."))};
 const tm=setTimeout(()=>{if(!done)retry()},25000);
 window[cb]=r=>{end();r?res(r):retry()};s.onerror=retry;
 const u=new URL(API_URL);u.searchParams.set("action",action);u.searchParams.set("callback",cb);if(token)u.searchParams.set("token",token);
 Object.entries(params).forEach(([k,v])=>v!=null&&u.searchParams.set(k,typeof v==="object"?JSON.stringify(v):String(v)));s.src=u;document.head.appendChild(s)};go()}).then(handle)}
function handle(r){if(!r.success){if(r.error==="SESSION_EXPIRED"&&token){forceLogin();}const e=new Error(r.message||"Request failed");e.api=1;throw e}return r}
async function api(action,params={},write=false){
 if(!write)return jsonp(action,params);
 try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,token,...params})});return handle(await r.json())}
 catch(e){if(e.api)throw e;if(JSON.stringify(params).length<4000)return jsonp(action,params);throw new Error("Network error while saving. Please try again.")}}

function fixUrl(u){u=String(u||"").trim();if(!u||u.startsWith("data:"))return u;
 const m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)||u.match(/drive\.google\.com\/(?:open|uc)\?[^#]*id=([\w-]+)/);
 return m?"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w800":u}

 if(src.startsWith("data:")){e.src=src;return}
 if(!e.getAttribute("src"))e.src=FALLBACK_LOGO;
 const t=new Image();t.onload=()=>{e.src=src};t.onerror=()=>{if(!e.getAttribute("src"))e.src=FALLBACK_LOGO};t.src=src}

  if(page==="winners")fWin();else if(page==="dashboard")dashboard()}}

function cropUI(n,im){const VW=Math.min(300,innerWidth-70),VH=Math.round(VW*1.2),ov=document.createElement("div");ov.className="modal";ov.style.zIndex=100;

 document.body.appendChild(ov);
 const cv=ov.querySelector("canvas"),c=cv.getContext("2d"),zm=ov.querySelector("input"),base=Math.max(VW/im.width,VH/im.height);let z=1,ox=VW/2,oy=VH/2,drag=null;
 const clamp=()=>{const iw=im.width*base*z,ih=im.height*base*z;ox=Math.min(iw/2,Math.max(VW-iw/2,ox));oy=Math.min(ih/2,Math.max(VH-ih/2,oy))};

 zm.oninput=()=>{const nz=+zm.value,r=nz/z;ox=VW/2+(ox-VW/2)*r;oy=VH/2+(oy-VH/2)*r;z=nz;draw()};

 ov.querySelector("#ccx").onclick=()=>ov.remove();
