<body>
<div id="loginView" class="login hidden"><div class="lb"><img id="loginLogo" alt=""><h2>MUSABAQA WINNERS</h2><p>Admin &amp; Poster Manager</p>
<form id="loginForm"><div class="fld"><label>USERNAME</label><input class="in" id="lu" autocomplete="username" required></div><div class="fld"><label>PASSWORD</label><input class="in" id="lp" type="password" autocomplete="current-password" required></div><button class="btn pri" id="lbtn" style="width:100%;margin-top:6px">Sign in</button></form></div></div>

<div id="appView" class="hidden">
<header class="top"><div class="brand"><img id="topLogo" alt=""><div><span>MUSABAQA WINNERS</span><small id="evl">Poster Manager</small></div></div><div class="sp"></div><button class="btn ic" title="Change password" onclick="openPw()" id="bKey"></button><button class="btn ic" title="Logout" onclick="logout()" id="bOut"></button></header>

<div id="modal" class="modal hidden"><div id="box" class="box"></div></div><div id="toast" class="toast hidden"></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwDqhg-SfGsHLqojDfxwmLYyTpcjmcjPfgimBSEx-DdXvC8b0xe1GOuP6MCmJPEYVUh/exec";
/* >>> PASTE YOUR BASE64 LOGO BETWEEN THE QUOTES BELOW (the long "data:image/jpeg;base64,..." string from your current file). Empty = generated "M" monogram. <<< */
const BUILTIN_LOGO="";
const FALLBACK_LOGO="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7b1fa2"/><stop offset="1" stop-color="#ff6f00"/></linearGradient></defs><rect width="100" height="100" rx="26" fill="url(#g)"/><text x="50" y="66" font-size="52" font-weight="900" text-anchor="middle" fill="#fff" font-family="Arial">M</text></svg>');
const LOGO0=BUILTIN_LOGO||FALLBACK_LOGO;
const I={home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0zM17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3"/>',image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M18 6L6 18M6 6l12 12"/>',dl:'<path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/>',edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>',key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',out:'<path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>',wa:'<path d="M21 12a9 9 0 01-13.4 7.8L3 21l1.3-4.4A9 9 0 1121 12z"/>'};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const NAV=[["dashboard","home","Home"],["items","list","Items"],["winners","trophy","Winners"],["posters","image","Posters"],["settings","gear","Settings"]];
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const q=v=>esc(JSON.stringify(String(v)));
let token=localStorage.getItem("musabaqa_session")||"",items=[],winners=[],madrasas=[],posters=[],settings={},page="dashboard",editId=null,selItem=null,wmap={};
const photos={1:"",2:"",3:""};
const MEDAL=["🥇","🥈","🥉"],POS=["1st Place","2nd Place","3rd Place"];

/* ---------- toast / modal ---------- */
function toast(m,ok){const t=$("toast");t.textContent=m;t.className="toast "+(ok?"ok":"err");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add("hidden"),3200)}
function openModal(h,c=""){$("box").className="box "+c;$("box").innerHTML=h;$("modal").classList.remove("hidden")}
function closeModal(){$("modal").classList.add("hidden")}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});

/* ---------- API: JSONP reads, POST writes ---------- */
function jsonp(action,params={}){return new Promise((res,rej)=>{let n=0;const go=()=>{n++;const cb="mq_"+Date.now()+"_"+Math.random().toString(36).slice(2),s=document.createElement("script");let done=false;
 const end=()=>{done=true;clearTimeout(tm);s.remove();delete window[cb]};const retry=()=>{end();n<3?setTimeout(go,900):rej(new Error("Cannot reach the server. Check the Web App URL / deployment."))};
 const tm=setTimeout(()=>{if(!done)retry()},25000);
 window[cb]=r=>{end();r?res(r):retry()};s.onerror=retry;
 const u=new URL(API_URL);u.searchParams.set("action",action);u.searchParams.set("callback",cb);if(token)u.searchParams.set("token",token);
 Object.entries(params).forEach(([k,v])=>v!=null&&u.searchParams.set(k,typeof v==="object"?JSON.stringify(v):String(v)));s.src=u;document.head.appendChild(s)};go()}).then(handle)}
function handle(r){if(!r.success){if(r.error==="SESSION_EXPIRED"&&token){forceLogin();}const e=new Error(r.message||"Request failed");e.api=1;throw e}return r}
async function api(action,params={},write=false){
 if(!write)return jsonp(action,params);
 try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,token,...params})});return handle(await r.json())}
 catch(e){if(e.api)throw e;if(JSON.stringify(params).length<4000)return jsonp(action,params);throw new Error("Network error while saving. Please try again.")}}
function forceLogin(){localStorage.removeItem("musabaqa_session");localStorage.removeItem("mq_cache");token="";showLogin()}

/* ---------- boot ---------- */
const show=(id,v)=>$(id).classList.toggle("hidden",!v);
function showLogin(){show("appView",0);show("loginView",1)}
function showApp(){show("loginView",0);show("appView",1)}
function fixUrl(u){u=String(u||"").trim();if(!u||u.startsWith("data:"))return u;
 const m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)||u.match(/drive\.google\.com\/(?:open|uc)\?[^#]*id=([\w-]+)/);
 return m?"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w800":u}
function setImg(id,src){const e=$(id);src=fixUrl(src)||FALLBACK_LOGO;if(e.dataset.src===src)return;e.dataset.src=src;
 if(src.startsWith("data:")){e.src=src;return}
 if(!e.getAttribute("src"))e.src=FALLBACK_LOGO;
 const t=new Image();t.onload=()=>{e.src=src};t.onerror=()=>{if(!e.getAttribute("src"))e.src=FALLBACK_LOGO};t.src=src}
function logos(){const l=settings.LOGO_URL||LOGO0;setImg("loginLogo",l);setImg("topLogo",l)}
function theme(){const r=document.documentElement.style;r.setProperty("--p",settings.PRIMARY_COLOR||"#7b1fa2");r.setProperty("--s",settings.SECONDARY_COLOR||"#ff6f00");r.setProperty("--a",settings.ACCENT_COLOR||"#ffd54f");$("evl").textContent=[settings.EVENT_NAME,settings.EVENT_YEAR].filter(Boolean).join(" • ")||"Poster Manager";logos()}
function index(){wmap={};winners.forEach(w=>wmap[w.ITEM_CODE]=w)}
const lite=w=>{const o=Object.assign({},w);[1,2,3].forEach(n=>o["WINNER_"+n+"_CANDIDATE_PHOTO"]="");delete o._ph;return o};
const brandOf=s=>{const o={};["LOGO_URL","EVENT_NAME","EVENT_YEAR","COLLEGE_NAME","PRIMARY_COLOR","SECONDARY_COLOR","ACCENT_COLOR"].forEach(k=>o[k]=s[k]);return o};
function apply(d){settings=d.settings||settings;items=d.items||items;madrasas=d.madrasas||madrasas;if(d.winners)winners=d.winners;if(d.posters)posters=d.posters;index();theme();
 try{localStorage.setItem("mq_cache",JSON.stringify({settings,items,madrasas,winners:winners.map(lite),posters}));localStorage.setItem("mq_brand",JSON.stringify(brandOf(settings)))}catch(e){}}
let cands=[],candsOk=false,candsBusy=false;
async function loadCands(){if(candsOk||candsBusy)return;candsBusy=true;try{const r=await api("candidates");cands=(r.data||[]).map(a=>({reg:a[0],chest:a[1],student:a[2],madrassa:a[3],cls:a[4],uid:a[5],dob:a[6],admn:a[7],section:a[8],items:a[9],_k:(a[1]+" "+a[2]+" "+a[0]).toLowerCase(),_i:String(a[9]||"").toLowerCase(),_t:String(a[9]||"").toLowerCase().split(/[,;|\/\n]+/).map(x=>x.trim()).filter(Boolean)}));candsOk=true}catch(e){console.warn(e)}candsBusy=false}
/* photos load in the background, a few winners at a time (newest first) */
async function loadPhotos(ids){
 ids=ids.filter(id=>{const w=winners.find(x=>x.ID===id);return w&&!w._ph});
 for(let i=0;i<ids.length;i+=4){const ch=ids.slice(i,i+4);
  try{const r=await api("winnerPhotos",{ids:ch});
   ch.forEach(id=>{const w=winners.find(x=>x.ID===id),p=r.data[id];if(!w)return;[1,2,3].forEach(n=>w["WINNER_"+n+"_CANDIDATE_PHOTO"]=(p&&p[n-1])||"");w._ph=1})}
  catch(e){console.warn(e);return}
  if(page==="winners")fWin();else if(page==="dashboard")dashboard()}}
const ensurePh=async ids=>{if(ids.some(id=>{const w=winners.find(x=>x.ID===id);return w&&!w._ph}))await loadPhotos(ids)};
function afterBoot(){loadPhotos(winners.slice().sort((a,b)=>String(b.CREATED_AT).localeCompare(String(a.CREATED_AT))).map(w=>w.ID));setTimeout(loadCands,2500)}
async function bootstrap(){const r=await api("bootstrap");apply(r.data);render();afterBoot()}
function cs(n){const box=$("cr"+n),v=$("wn"+n).value.trim().toLowerCase();if(!v){box.innerHTML="";return}
 if(!candsOk){loadCands();box.innerHTML='<div class="mu" style="padding:8px">Loading candidates…</div>';return}
 const code=selItem?String(selItem.code).toLowerCase():"",nm=selItem?String(selItem.item).toLowerCase():"";
 const reg=c=>!!selItem&&c._t.some(t=>t===code||t===nm||(nm.length>3&&(t.includes(nm)||nm.includes(t)&&t.length>3)));const r=[];
